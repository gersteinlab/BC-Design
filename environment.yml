name: opencpdcopy-minimal
channels:
  - pytorch
  - conda-forge
  - nvidia # Kept for nvidia drivers/libs if not covered by pytorch channel for all needs
  - bioconda # Kept for biopython and potentially other bio-related tools
  - defaults
dependencies:
  # Core Python
  - python=3.12.4

  # PyTorch Ecosystem
  - pytorch=2.3.0
  - pytorch-cuda=12.1 # This will pull in CUDA toolkit libs for PyTorch
  - torchaudio=2.3.0
  - torchvision=0.18.0
  - torchtriton=3.0.0 # For Triton integration with PyTorch

  # Machine Learning Frameworks & Libraries
  - lightning=2.3.3 # or pytorch-lightning, 'lightning' is the newer name
  - timm=1.0.7
  - scikit-learn=1.5.1

  # Data Handling & Scientific Computing
  - numpy=2.0.1
  - pyyaml=6.0.1
  - pillow=10.4.0 # For image manipulation
  - matplotlib=3.9.1 # For plotting
  - networkx=3.3 # For graph analysis, if not covered by torch-geometric's scope

  # Jupyter & Development
  - jupyterlab=4.2.4 # Will pull in notebook, ipykernel, etc.
  - tqdm=4.66.4 # Progress bars

  # Multimedia
  - ffmpeg=7.0.1 # If you process audio/video files

  # Pip, for installing pip packages below
  - pip=24.0

  # PIP dependencies:
  # Keep packages that are pip-only, have specific versions not on conda,
  # or are critical parts of your workflow managed via pip.
  - pip:
      - deepspeed==0.14.4
      - nni==3.0 # Microsoft NNI
      - wandb==0.17.5 # Experiment tracking

      - torch-geometric==2.5.3  
      - torch-cluster==1.6.3 # pip
      - torch-scatter==2.1.2 # pip

      - transformers==4.43.3 # pip
      - huggingface-hub==0.24.2 # pip

      - scipy==1.14.0 # pip
      - pandas==2.2.2 # pip

      # Bioinformatics
      - biopython==1.84 # pip

      # Configuration & Utilities
      - omegaconf==2.3.0 # pip
      - requests==2.32.3 # pip

      # Specific NVIDIA libraries for CUDA 12.x, often for DeepSpeed/Triton
      # - nvidia-cublas-cu12==12.1.3.1
      # - nvidia-cuda-cupti-cu12==12.1.105
      # - nvidia-cuda-nvrtc-cu12==12.1.105
      # - nvidia-cuda-runtime-cu12==12.1.105
      # - nvidia-cudnn-cu12==9.1.0.70
      # - nvidia-cufft-cu12==11.0.2.54
      # - nvidia-curand-cu12==10.3.2.106
      # - nvidia-cusolver-cu12==11.4.5.107
      # - nvidia-cusparse-cu12==12.1.0.106
      # - nvidia-ml-py==12.555.43
      # - nvidia-nccl-cu12==2.20.5
      # - nvidia-nvjitlink-cu12==12.5.82
      # - nvidia-nvtx-cu12==12.1.105
      # - triton==3.0.0 # If torchtriton from conda is not sufficient or if standalone triton is used

      # Core utilities often managed by pip or with specific versions
      - torcheval==0.0.7
      - setuptools==71.1.0 # Build system